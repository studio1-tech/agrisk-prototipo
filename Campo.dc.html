<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App do perito · vistoria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2EC4B6}a:hover{color:#7FE3D8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1A15; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E8F0EC; display: flex; flex-direction: column; overflow: hidden">
<header style="background: #0A1410; border-bottom: 1px solid #1B2D26; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
<a href="Pericia.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; border-radius: 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">Vistoria SIN-2026-0093</span><span style="font-size: 12px; color: #C7D6CE">Santa Luzia · T7 · soja R2</span></div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #FFB07A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M1 1l22 22M16.7 11.1A11 11 0 0 1 19 12.5M5 12.5a11 11 0 0 1 5.2-2.4M10.7 5a16 16 0 0 1 12.3 3.6M1 8.6a16 16 0 0 1 4.7-2.9M8.5 16.1a5 5 0 0 1 7 0M12 20h.01"></path></svg>Offline</span>
</header>
<div style="flex: 1 1 auto; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
<svg viewBox="0 0 330 130" width="100%" role="img" aria-label="Mapa do talhão com 8 pontos; ponto atual destacado" style="display: block; border-radius: 10px; background: #10211B"><path d="M30 20 L280 8 L318 92 L190 126 L44 118 Z" fill="#2E5E4B" stroke="#4CC38A" stroke-width="2"></path><circle cx="70" cy="40" r="{{r0}}" fill="{{f0}}" stroke="#E8F0EC" stroke-width="1.5"></circle><circle cx="110" cy="58" r="{{r1}}" fill="{{f1}}" stroke="#E8F0EC" stroke-width="1.5"></circle><circle cx="200" cy="30" r="{{r2}}" fill="{{f2}}" stroke="#E8F0EC" stroke-width="1.5"></circle><circle cx="240" cy="52" r="{{r3}}" fill="{{f3}}" stroke="#E8F0EC" stroke-width="1.5"></circle><circle cx="160" cy="92" r="{{r4}}" fill="{{f4}}" stroke="#E8F0EC" stroke-width="1.5"></circle><circle cx="90" cy="104" r="{{r5}}" fill="{{f5}}" stroke="#E8F0EC" stroke-width="1.5"></circle><circle cx="220" cy="104" r="{{r6}}" fill="{{f6}}" stroke="#E8F0EC" stroke-width="1.5"></circle><circle cx="268" cy="88" r="{{r7}}" fill="{{f7}}" stroke="#E8F0EC" stroke-width="1.5"></circle></svg>
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 18px; font-weight: 600">Ponto {{point}} de 8</span><span style="font-size: 12px; color: #A6B8AF; font-family: 'IBM Plex Mono', ui-monospace, monospace">{{coords}}</span></div>
<div style="font-size: 13px; color: #A6B8AF">{{zone}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label for="c1" style="font-size: 12px; color: #A6B8AF">Plantas em 2 m</label><div style="display: flex; align-items: center; gap: 6px"><input id="c1" value="26" inputmode="decimal" style="width: 100%; height: 44px; padding: 0 10px; border: 1px solid #3A5248; background: #142620; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 600; box-sizing: border-box; color: #E8F0EC; min-width: 0"><span style="font-size: 12px; color: #A6B8AF; flex: 0 0 auto">pl</span></div></div><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label for="c2" style="font-size: 12px; color: #A6B8AF">Vagens por planta</label><div style="display: flex; align-items: center; gap: 6px"><input id="c2" value="18" inputmode="decimal" style="width: 100%; height: 44px; padding: 0 10px; border: 1px solid #3A5248; background: #142620; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 600; box-sizing: border-box; color: #E8F0EC; min-width: 0"><span style="font-size: 12px; color: #A6B8AF; flex: 0 0 auto">vg</span></div></div><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label for="c3" style="font-size: 12px; color: #A6B8AF">Grãos por vagem</label><div style="display: flex; align-items: center; gap: 6px"><input id="c3" value="2,1" inputmode="decimal" style="width: 100%; height: 44px; padding: 0 10px; border: 1px solid #3A5248; background: #142620; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 600; box-sizing: border-box; color: #E8F0EC; min-width: 0"><span style="font-size: 12px; color: #A6B8AF; flex: 0 0 auto">gr</span></div></div><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label for="c4" style="font-size: 12px; color: #A6B8AF">Peso de mil grãos</label><div style="display: flex; align-items: center; gap: 6px"><input id="c4" value="148" inputmode="decimal" style="width: 100%; height: 44px; padding: 0 10px; border: 1px solid #3A5248; background: #142620; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 600; box-sizing: border-box; color: #E8F0EC; min-width: 0"><span style="font-size: 12px; color: #A6B8AF; flex: 0 0 auto">g</span></div></div>
</div>
<div style="display: flex; gap: 8px">
<div style="flex: 1 1 0; height: 64px; border-radius: 8px; background: #24392F; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #A6B8AF">Foto 1</div>
<div style="flex: 1 1 0; height: 64px; border-radius: 8px; background: #24392F; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #A6B8AF">Foto 2</div>
<button type="button" aria-label="Tirar foto georreferenciada" style="flex: 1 1 0; height: 64px; border-radius: 8px; border: 1px dashed #6E857A; background: #142620; color: #E8F0EC; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></button>
</div>
<div role="group" aria-label="Checklist do ponto" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
<button type="button" role="checkbox" aria-checked="{{c.checked}}" onClick="{{c.toggle}}" style="{{c.style}}"><span style="{{c.box}}">{{c.mark}}</span><span style="text-align: left">{{c.label}}</span></button>
</sc-for></div>
</div>
<footer style="padding: 12px 16px 16px; background: #142620; border-top: 1px solid #24392F; display: flex; flex-direction: column; gap: 8px">
<div style="height: 6px; border-radius: 3px; background: #213A31; overflow: hidden"><div style="height: 6px; background: #4CC38A; width: {{progress}}"></div></div>
<button type="button" onClick="{{next}}" style="min-height: 48px; border-radius: 10px; border: none; background: #2EC4B6; color: #0E1113; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{nextLabel}}</button>
<a href="Regulacao.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">Sincronizar e enviar laudo</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { point: 3, done: [true, false, false] };
  }
  renderVals() {
    const pts = [[70,40],[110,58],[200,30],[240,52],[160,92],[90,104],[220,104],[268,88]];
    const zones = ['Vigor baixo', 'Vigor baixo', 'Vigor médio', 'Vigor médio', 'Vigor médio', 'Vigor baixo', 'Vigor muito baixo', 'Vigor muito baixo'];
    const p = this.state.point;
    const L = ['Fotos georreferenciadas do ponto', 'Sintomas de déficit hídrico (folhas murchas, abortamento de flores)', 'Sem sinal de falha de manejo ou de doença'];
    const done = this.state.done;
    return {
      point: p,
      coords: '-17.79' + p + ', -50.92' + (p * 3),
      zone: zones[p - 1] + ' · amostra de 2 m lineares em 2 fileiras',
      ...Object.fromEntries(pts.flatMap((_, i) => [['r' + i, i + 1 === p ? 9 : 6], ['f' + i, i + 1 < p ? '#4CC38A' : i + 1 === p ? '#2EC4B6' : '#FFFFFF']])),
      checks: L.map((label, i) => ({ label, checked: done[i] ? 'true' : 'false', mark: done[i] ? '✓' : '',
        toggle: () => { const d = done.slice(); d[i] = !d[i]; this.setState({ done: d }); },
        style: 'display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid #24392F; background: #142620; font: inherit; font-size: 14px; color: #E8F0EC; cursor: pointer',
        box: 'width: 24px; height: 24px; flex: 0 0 auto; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #0E1113; background: ' + (done[i] ? '#4CC38A' : '#142620') + '; border: 2px solid ' + (done[i] ? '#4CC38A' : '#6E857A') })),
      progress: Math.round(((p - 1) / 8) * 100) + '%',
      nextLabel: p < 8 ? 'Concluir ponto ' + p : 'Concluir último ponto',
      next: () => this.setState({ point: p < 8 ? p + 1 : 8, done: [false, false, false] })
    };
  }
}
</script>
</body>
</html>
